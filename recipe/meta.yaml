{% set name = "glidertest" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/glidertest-{{ version }}.tar.gz
  sha256: a91e2d60f5f36caa3434783674e9e356204d0cc2cfc2ad3947904a0f5543a222

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm >=3.4
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - pooch
    - xarray
    - numpy
    - matplotlib
    - pandas
    - seaborn
    - scipy
    - skyfield
    - gsw
    - sgp4 >=2.14
    - cartopy
    - folium
    - cmocean
    - h5netcdf
    - ruamel.yaml >=0.18
    - ipywidgets
    - ipython
    - pyyaml
    - ioos-qc
    - h5py
    - jinja2
    - pillow


test:
  imports:
    - glidertest
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/callumrollo/glidertest
  summary: Diagnostic tests of glider quality
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - callumrollo
